<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iwiTitle">
  <title id="iwiTitle">Internal wall insulation cross-section: masonry wall, insulation board, vapour control layer and plasterboard finish</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset="1" stop-color="#082d6b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <!-- diagonal texture -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <path d="M-50 550 L550 -50"/><path d="M-20 580 L580 -20"/><path d="M10 610 L610 10"/>
    <path d="M-80 520 L520 -80"/><path d="M-110 490 L490 -110"/>
  </g>

  <!-- wall cross-section, layered left to right -->
  <g transform="translate(120,90)">
    <!-- outer masonry wall -->
    <rect x="0" y="0" width="60" height="320" fill="#c9a97c"/>
    <g stroke="#8a6f4d" stroke-width="2">
      <line x1="0" y1="40" x2="60" y2="40"/>
      <line x1="0" y1="80" x2="60" y2="80"/>
      <line x1="0" y1="120" x2="60" y2="120"/>
      <line x1="0" y1="160" x2="60" y2="160"/>
      <line x1="0" y1="200" x2="60" y2="200"/>
      <line x1="0" y1="240" x2="60" y2="240"/>
      <line x1="0" y1="280" x2="60" y2="280"/>
      <line x1="30" y1="0" x2="30" y2="40"/>
      <line x1="15" y1="40" x2="15" y2="80"/>
      <line x1="45" y1="40" x2="45" y2="80"/>
      <line x1="30" y1="80" x2="30" y2="120"/>
      <line x1="15" y1="120" x2="15" y2="160"/>
      <line x1="45" y1="120" x2="45" y2="160"/>
      <line x1="30" y1="160" x2="30" y2="200"/>
      <line x1="15" y1="200" x2="15" y2="240"/>
      <line x1="45" y1="200" x2="45" y2="240"/>
      <line x1="30" y1="240" x2="30" y2="280"/>
      <line x1="15" y1="280" x2="15" y2="320"/>
      <line x1="45" y1="280" x2="45" y2="320"/>
    </g>

    <!-- insulation board -->
    <rect x="60" y="0" width="70" height="320" fill="#FF7A00"/>
    <g stroke="#e06a00" stroke-width="2" opacity="0.6">
      <line x1="60" y1="20" x2="130" y2="20"/>
      <line x1="60" y1="60" x2="130" y2="60"/>
      <line x1="60" y1="100" x2="130" y2="100"/>
      <line x1="60" y1="140" x2="130" y2="140"/>
      <line x1="60" y1="180" x2="130" y2="180"/>
      <line x1="60" y1="220" x2="130" y2="220"/>
      <line x1="60" y1="260" x2="130" y2="260"/>
      <line x1="60" y1="300" x2="130" y2="300"/>
    </g>

    <!-- vapour control layer -->
    <rect x="130" y="0" width="8" height="320" fill="#ffffff"/>

    <!-- plasterboard finish -->
    <rect x="138" y="0" width="30" height="320" fill="#e9edf5"/>

    <!-- fixing dots -->
    <g fill="#ffffff">
      <circle cx="95" cy="60" r="4"/>
      <circle cx="95" cy="160" r="4"/>
      <circle cx="95" cy="260" r="4"/>
    </g>

    <!-- labels with leader lines -->
    <g font-family="Inter, sans-serif" font-size="15" fill="#ffffff">
      <line x1="30" y1="-10" x2="30" y2="-40" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
      <text x="-20" y="-50" fill="#ffffff" opacity="0.9">Existing Wall</text>

      <line x1="95" y1="-10" x2="95" y2="-70" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
      <text x="55" y="-80" fill="#FF7A00" font-weight="700">Insulation Board</text>

      <line x1="134" y1="330" x2="134" y2="360" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
      <text x="60" y="378" fill="#ffffff" opacity="0.9">Vapour Control Layer</text>

      <line x1="153" y1="-10" x2="153" y2="-40" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
      <text x="140" y="-50" fill="#ffffff" opacity="0.9">Plasterboard Finish</text>
    </g>
  </g>

  <text x="300" y="470" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="15" font-weight="700"
        letter-spacing="1.5" fill="#ffffff" opacity="0.85">INTERNAL WALL INSULATION SYSTEM</text>
</svg>
