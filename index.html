<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b2f68">
  <meta name="description" content="ThermoBuild Systems — our new website is under construction.">
  <title>ThermoBuild Systems | Coming Soon</title>
  <style>
    :root {
      --navy: #0b3474;
      --blue: #0877c9;
      --orange: #f4770b;
      --grey: #62666b;
      --light: #f5f7fa;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--navy);
      background:
        radial-gradient(circle at 15% 15%, rgba(8,119,201,.08), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(244,119,11,.08), transparent 30%),
        var(--light);
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 760px);
      text-align: center;
      padding: clamp(28px, 6vw, 58px);
      background: #fff;
      border: 1px solid rgba(11,52,116,.09);
      border-radius: 24px;
      box-shadow: 0 22px 70px rgba(18,42,76,.10);
    }
    .logo {
      display: block;
      width: min(100%, 330px);
      height: auto;
      margin: 0 auto 26px;
    }
    .rule {
      width: 76px;
      height: 5px;
      margin: 0 auto 24px;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--navy) 0 50%, var(--orange) 50% 100%);
    }
    h1 {
      margin: 0 0 14px;
      color: var(--navy);
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    h1 span { color: var(--orange); }
    p {
      max-width: 520px;
      margin: 0 auto;
      color: var(--grey);
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.7;
    }
    .footer {
      margin-top: 34px;
      color: #858990;
      font-size: .82rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    @media (max-width: 480px) {
      main { border-radius: 18px; }
      .logo { width: min(100%, 270px); }
    }
  </style>
</head>
